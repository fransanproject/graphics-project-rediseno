<!--
  GRAPHICS PROJECT — Módulo de puntos de venta, listo para Shopify.
  Extraído tal cual de la demo concepto v71 (https://fransanproject.github.io/graphics-project-rediseno/):
  lista plegable por comunidades/provincias con buscador, mapa Leaflet con los 277 puntos,
  ficha de la óptica seleccionada, botón «Vamos a por mis Graphics» y direcciones en Google Maps.
  No incluye nada del resto de la demo (ni hero, ni fichas de modelos, ni tienda): solo esta página.

  INSTALAR — Opción A (recomendada, como sección):
    1. En Shopify: Tienda online → Temas → … → Editar código → Sections → Añadir una nueva sección
       y guardar este archivo como sections/gp-points-of-sale.liquid.
    2. En el editor del tema: añadir la sección «Graphics – Points of sale» a la página de puntos
       de venta (o a una página nueva) y publicar. Probar antes en una copia del tema.
  INSTALAR — Opción B (bloque Custom Liquid):
    Pegar todo el archivo MENOS el bloque  del final.

  IDIOMA: inglés y español automáticos según el locale de la tienda (request.locale.iso_code).
  Si se pega como HTML plano sin Liquid, queda en inglés.

  ACTUALIZAR TIENDAS: editar el array POINTS al inicio del script (un único sitio). Cada tienda:
    {"region":"GALICIA","province":"PONTEVEDRA","name":"...","address":"...","town":"...",
     "phone":"...","lat":42.26,"lon":-8.78,"approx":"exact"|"town"|"fallback"}
    Los campos lat/lon son los que sitúan el punto en el mapa. Datos: foto del 2026-10-29 de la
    lista de /en/search; actualizar POINTS cuando la marca cambie su lista.
    Nota: en la demo el título «points_title» no tenía traducción y salía en español en todos los
    idiomas; aquí se define en inglés y español (ver GP_TEXT).

  DEPENDENCIAS: Leaflet 1.9.4 desde unpkg (CSS y JS incluidos arriba). Si el CDN falla, el módulo
  muestra automáticamente el mapa esquemático de respaldo (SVG de España/Europa) con los mismos puntos.
  Todo el CSS va bajo #gp-points: no toca el resto del tema, ni productos, ni checkout.
-->

    var regs = []; POINTS.forEach(function(p){ if(regs.indexOf(p.region) < 0) regs.push(p.region); });
    regs.forEach(function(r){ var o = document.createElement('option'); o.value = r; o.textContent = r; regionSel.appendChild(o); });
    regionSel.addEventListener('change', renderPoints);
    document.getElementById('posSearch').addEventListener('input', renderPoints);
    posRendered = true;
  }
  var q = (document.getElementById('posSearch').value || '').toLowerCase();
  var reg = regionSel.value;
  var list = POINTS.filter(function(p){
    return (reg === 'ALL' || p.region === reg) && (!q || (p.name + ' ' + p.address + ' ' + p.town).toLowerCase().indexOf(q) >= 0);
  });
  var html = '';
  var groups = {}, order = [];
  list.forEach(function(p){ if(!groups[p.region]){ groups[p.region] = []; order.push(p.region); } groups[p.region].push(p); });
  if(posSelected !== null && POINTS[posSelected]) posOpen[POINTS[posSelected].region] = true;
  if(reg !== 'ALL') posOpen[reg] = true;
  var prevIntl = false, first = true;
  order.forEach(function(r){
    var isIntl = INTL.indexOf(r) >= 0;
    if(isIntl && !prevIntl && !first) html += '<div class="pos-region">' + (I18N_PAGES[currentLang] || I18N_PAGES.EN).intl_heading + '</div>';
    var open = (q !== '') || !!posOpen[r];
    html += '<button type="button" class="pos-region-btn" data-region="' + r + '" aria-expanded="' + open + '"><span>' + r + '</span><span class="pos-count">' + groups[r].length + ' ' + (open ? '−' : '+') + '</span></button>';
    if(open){
      var lastProv = '';
      groups[r].forEach(function(p){
        var gi = POINTS.indexOf(p);
        if(p.province && p.province !== lastProv){ html += '<div class="pos-prov">' + p.province + '</div>'; lastProv = p.province; }
        html += '<button class="pos-item' + (posSelected === gi ? ' active' : '') + '" data-pos="' + gi + '"><b>' + p.name + '</b><span>' + p.address + '</span><br><a class="tel" href="' + telHref(p.phone) + '" onclick="event.stopPropagation()">' + p.phone + '</a>' + (posSelected === gi ? '<br><a href="https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-top:2px" title="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '" aria-label="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '">' + '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 2C8.13 2 5 5.13 5 8.5c0 5.25 7 13 7 13s7-7.75 7-13C19 5.13 15.87 2 12 2zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>' + ((I18N[currentLang] || I18N.EN).maps_cta || 'Vamos a por mis Graphics') + '</span>' + '</a>' : '') + '</button>';
      });
    }
    prevIntl = isIntl; first = false;
  });
  document.getElementById('posList').innerHTML = html || '<p>' + (I18N_PAGES[currentLang] || I18N_PAGES.EN).no_stores + '</p>';
  document.querySelectorAll('#posList .pos-item').forEach(function(btn){
    btn.addEventListener('click', function(){ selectPoint(parseInt(btn.getAttribute('data-pos'), 10)); });
  });
  if(initOsm()){
    document.getElementById('osmMap').style.display = '';
    document.getElementById('posMapFallback').hidden = true;
    updateOsmMarkers(list);
  } else {
    document.getElementById('osmMap').style.display = 'none';
    document.getElementById('posMapFallback').hidden = false;
    renderMap(list);
  }
}
function renderMap(list){
  var spainDots = '', europeDots = '';
  list.forEach(function(p){
    var gi = POINTS.indexOf(p);
    if(INTL.indexOf(p.region) >= 0){
      var e = europeXY(p.lat, p.lon);
      if(p.lon > -20) europeDots += '<circle class="halo" cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="17" fill="' + (posSelected === gi ? '#e4d000' : (window.__ACCENT || '#e4d000')) + '" opacity="0.35" pointer-events="none"><animate attributeName="opacity" values="0.35;0;0.35" dur="1s" repeatCount="indefinite"/></circle><circle class="dot" data-pos="' + gi + '" cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="9" fill="' + (posSelected === gi ? '#e4d000' : (window.__ACCENT || '#e4d000')) + '" stroke="#ffffff" stroke-width="2"/>';
    } else {
      var s = spainXY(p.lat, p.lon);
      spainDots += '<circle class="halo" cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="16" fill="' + (posSelected === gi ? '#e4d000' : (window.__ACCENT || '#e4d000')) + '" opacity="0.35" pointer-events="none"><animate attributeName="opacity" values="0.35;0;0.35" dur="1s" repeatCount="indefinite"/></circle><circle class="dot" data-pos="' + gi + '" cx="' + s[0].toFixed(1) + '" cy="' + s[1].toFixed(1) + '" r="8" fill="' + (posSelected === gi ? '#e4d000' : (window.__ACCENT || '#e4d000')) + '" stroke="#ffffff" stroke-width="1.5"/>';
    }
  });
  var pin = '';
  if(posSelected !== null){
    var sp = POINTS[posSelected];
    if(INTL.indexOf(sp.region) < 0 && sp.lon > -20){
      var ps = spainXY(sp.lat, sp.lon);
      pin = '<g><circle cx="' + ps[0].toFixed(1) + '" cy="' + ps[1].toFixed(1) + '" r="14" fill="#e4d000" opacity="0.35"><animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/></circle><circle cx="' + ps[0].toFixed(1) + '" cy="' + ps[1].toFixed(1) + '" r="8" fill="#e4d000" stroke="#14140c" stroke-width="2"/><text x="' + (ps[0] + 14).toFixed(1) + '" y="' + (ps[1] - 10).toFixed(1) + '" fill="#e4d000" font-size="13" font-weight="900">' + sp.name + '</text></g>';
    }
  }
  document.getElementById('posMapSpain').innerHTML = '<svg viewBox="0 0 900 620" role="img" aria-label="Schematic map of Spain"><path d="' + SPAIN_OUTLINE + '" fill="#f4eedc" fill-opacity="0.12" stroke="#e4d000" stroke-width="1.5"/><circle cx="' + spainXY(39.57, 2.65)[0] + '" cy="' + spainXY(39.57, 2.65)[1] + '" r="10" fill="#f4eedc" fill-opacity="0.12" stroke="#e4d000"/><text x="60" y="40" fill="#e4d000" font-size="16" font-weight="900">ESPAÑA</text>' + spainDots + pin + '</svg>';
  var epin = '';
  if(posSelected !== null){
    var ep = POINTS[posSelected];
    if(INTL.indexOf(ep.region) >= 0 && ep.lon > -20){
      var pe = europeXY(ep.lat, ep.lon);
      epin = '<g><circle cx="' + pe[0].toFixed(1) + '" cy="' + pe[1].toFixed(1) + '" r="14" fill="#e4d000" opacity="0.35"><animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/></circle><circle cx="' + pe[0].toFixed(1) + '" cy="' + pe[1].toFixed(1) + '" r="8" fill="#e4d000" stroke="#14140c" stroke-width="2"/><text x="' + (pe[0] + 14).toFixed(1) + '" y="' + (pe[1] - 10).toFixed(1) + '" fill="#e4d000" font-size="13" font-weight="900">' + ep.name + '</text></g>';
    }
  }
  document.getElementById('posMapEurope').innerHTML = '<svg viewBox="0 0 900 600" role="img" aria-label="Schematic map of Europe"><text x="60" y="40" fill="#e4d000" font-size="16" font-weight="900">EUROPA</text>' + europeDots + epin + '</svg>';
  var showEurope = posSelected !== null && INTL.indexOf(POINTS[posSelected].region) >= 0;
  document.getElementById('posMapSpain').hidden = showEurope;
  document.getElementById('posMapEurope').hidden = !showEurope;
  document.querySelectorAll('#posMapSpain .dot, #posMapEurope .dot').forEach(function(c){
    c.addEventListener('click', function(){ selectPoint(parseInt(c.getAttribute('data-pos'), 10)); });
  });
}

/* v16: real OpenStreetMap map with satellite layer */
var osmMap = null, osmLayer = null, osmSelectedMarker = null, osmSelectedHalo = null, osmHalos = [];
function initOsm(){
  if(typeof L === 'undefined') return false;
  if(osmMap) return true;
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap contributors'});
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, attribution: 'Imagery © Esri'});
  osmMap = L.map('osmMap', {scrollWheelZoom: true, attributionControl: false});
  sat.addTo(osmMap);
  L.control.layers({'Mapa': osm, 'Satélite': sat}).addTo(osmMap);
  osmLayer = L.layerGroup().addTo(osmMap);
  osmMap.setView([40.2, -3.7], 6);
  return true;
}
function osmPopup(p){
  return '<b>' + p.name + '</b><br>' + p.address + '<br>' + p.town + ' · ' + p.region + '<br><a href="' + telHref(p.phone) + '">' + p.phone + '</a><br><a href="https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener" title="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '" aria-label="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '" style="display:inline-flex;align-items:center;gap:6px;margin-top:6px">' + '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 2C8.13 2 5 5.13 5 8.5c0 5.25 7 13 7 13s7-7.75 7-13C19 5.13 15.87 2 12 2zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>' + ((I18N[currentLang] || I18N.EN).maps_cta || 'Vamos a por mis Graphics') + '</span>' + '</a>';
}
function updateOsmMarkers(list){
  if(!osmMap) return;
  osmLayer.clearLayers(); osmHalos = [];
  if(osmSelectedMarker){ osmMap.removeLayer(osmSelectedMarker); osmSelectedMarker = null; }
  if(osmSelectedHalo){ osmMap.removeLayer(osmSelectedHalo); osmSelectedHalo = null; }
  list.forEach(function(p){
    var gi = POINTS.indexOf(p);
    var c = L.circleMarker([p.lat, p.lon], {radius: 10, color: '#ffffff', weight: 2, fillColor: (window.__ACCENT || '#e4d000'), fillOpacity: 0.9});
    var h = L.circleMarker([p.lat, p.lon], {radius: 17, color: '#14140c', weight: 0, fillColor: (window.__ACCENT || '#e4d000'), fillOpacity: 0.35, interactive: false}); h.addTo(osmLayer); osmHalos.push(h);
    c.on('click', function(){ selectPoint(gi); });
    c.addTo(osmLayer);
  });
  if(posSelected !== null){
    var sp = POINTS[posSelected];
    osmSelectedHalo = L.circleMarker([sp.lat, sp.lon], {radius: 19, color: '#14140c', weight: 0, fillColor: (window.__ACCENT || '#e4d000'), fillOpacity: 0.35, interactive: false}).addTo(osmMap); osmHalos.push(osmSelectedHalo);
    osmSelectedMarker = L.circleMarker([sp.lat, sp.lon], {radius: 11, color: '#ffffff', weight: 2, fillColor: (window.__ACCENT || '#e4d000'), fillOpacity: 1}).addTo(osmMap);
    osmSelectedMarker.bindPopup(osmPopup(sp)).openPopup();
  }
}
var osmHaloOn = true;
setInterval(function(){
  osmHaloOn = !osmHaloOn;
  var hfo = osmHaloOn ? 0.4 : 0;
  osmHalos.forEach(function(m){ try{ m.setStyle({fillOpacity: hfo}); }catch(e){} });
}, 500);
function osmFlyToSelected(){
  if(!osmMap || posSelected === null) return;
  var sp = POINTS[posSelected];
  var z = (sp.approx === 'town') ? 15 : 11;
  osmMap.flyTo([sp.lat, sp.lon], z, {duration: 1.2});
  if(osmSelectedMarker) osmSelectedMarker.openPopup();
}

function selectPoint(gi){
  posSelected = gi;
  var p = POINTS[gi];
  document.getElementById('posDetail').innerHTML = '<h3>' + p.name + '</h3><p>' + p.address + '<br>' + p.town + ' · ' + p.region + '</p><p><a href="' + telHref(p.phone) + '">' + p.phone + '</a>' + '</p><p style="margin-top:14px"><a class="btn-yellow" href="https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener" title="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '" aria-label="' + ((I18N[currentLang] || I18N.EN).open_maps || 'Open in Google Maps') + '" style="padding:12px 14px;display:inline-flex;align-items:center;gap:8px">' + '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 2C8.13 2 5 5.13 5 8.5c0 5.25 7 13 7 13s7-7.75 7-13C19 5.13 15.87 2 12 2zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>' + ((I18N[currentLang] || I18N.EN).maps_cta || 'Vamos a por mis Graphics') + '</span>' + '</a></p>';
  renderPoints();
  osmFlyToSelected();
  document.getElementById('view-points').querySelector('.pos-map').scrollIntoView({behavior:'smooth', block:'start'});
}
/* Arranque (en la demo esto lo hacia la vista de puntos al abrirse; aqui la seccion siempre esta visible) */
initOsm();
renderPoints();
setTimeout(function(){ if (osmMap) osmMap.invalidateSize(); }, 300);
</script>
